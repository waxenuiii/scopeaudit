[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waxenuiii-scopeaudit"
version = "0.1.0"
description = "比对资源清单与授权清单，标出越权与权限不足的地方"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "waxenuiii" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://waxenuiii.github.io"
Repository = "https://github.com/waxenuiii/scopeaudit"
Issues = "https://github.com/waxenuiii/scopeaudit/issues"

[project.scripts]
scopeaudit = "scopeaudit:main"

[tool.setuptools]
py-modules = ["scopeaudit"]
